<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
</head>
<body>
    <div class="big-container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; padding: 0px 15px 15px 15px ; border-bottom: 1px solid #e2e8f0;">
            <h2 style="margin: 0; color: #1e293b; font-size: 1.5rem;">
                <i class="fa-solid fa-clipboard-check" style="color: #3b82f6; margin-right: 8px;"></i>Task Manager
            </h2>
            <button onclick="logout()" style="background-color: #ef4444; color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: background-color 0.2s;">
                <i class="fa-solid fa-right-from-bracket"></i> Αποσύνδεση
            </button>
        </div>

        <div class="stats-container">
            <div class="stat-card">
                <div class="stat-icon"><i class="fa-solid fa-list-check"></i></div>
                <div class="stat-title">Συνολικά</div>
                <div class="stat-number" id="stat-total">0</div>
            </div>
            
            <div class="stat-card">
                <div class="stat-icon color-completed"><i class="fa-solid fa-circle-check"></i></div>
                <div class="stat-title">Ολοκληρωμένα</div>
                <div class="stat-number color-completed" id="stat-completed">0</div>
            </div>
            
            <div class="stat-card">
                <div class="stat-icon color-pending"><i class="fa-solid fa-hourglass-half"></i></div>
                <div class="stat-title">Εκκρεμή</div>
                <div class="stat-number color-pending" id="stat-notCompleted">0</div>
            </div>
            
            <div class="stat-card">
                <div class="stat-icon color-expired"><i class="fa-solid fa-triangle-exclamation"></i></div>
                <div class="stat-title">Ληγμένα</div>
                <div class="stat-number color-expired" id="stat-expired">0</div>
            </div>
        </div>

        <div class="main-layout">
            
            <div class="task-column container">
                <h1>Οι Εργασίες μου</h1>
                
                <p id="selectedDateLabel" style="color: orangered; font-weight: bold; margin-bottom: 10px;">Καμία ημερομηνία επιλεγμένη</p>
                
                <div class="input-section">
                    <input type="text" id="taskTitle" placeholder="Νέα εργασία...">
                    <select id="taskCategory">
                        <option value="">(Χωρίς Κατηγορία)</option>
                    </select>
                    <div id="newCategoryContainer" style="display: none; flex: 1; gap: 5px;">
                        <input type="text" id="newCategoryName" placeholder="Όνομα νέας κατηγορίας...">
                        <button type="button" class="add-btn" onclick="saveNewCategory()">✓</button>
                        <button type="button" class="delete-btn" onclick="cancelNewCategory()">✗</button>
                    </div>
                    <button type="button" class="btn" style="background: none; border: none; font-size: 1.2rem;" id="manageCategoriesBtn" onclick="openCategoryModal()" title="Διαχείριση Κατηγοριών">⚙️</button>
                    <button class="add-btn" onclick="addTask()">Προσθήκη</button>
                </div>
                
                <ul id="taskList"></ul>
            </div>

            <div class="calendar-column">
                <div class="calendar">
                    <div class="header">
                        <div id="prev" class="btn"><i class="fa-solid fa-arrow-left"></i></div>
                        <div id="month-year"></div>
                        <div id="next" class="btn"><i class="fa-solid fa-arrow-right"></i></div>
                    </div>
                    <div class="weekdays">
                        <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
                    </div>
                    <div class="days" id="days"></div>
                </div>
            </div>
            
        </div>
        
        <div id="categoryModal" class="modal-overlay" style="display: none;">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Διαχείριση Κατηγοριών</h2>
                    <span class="close-modal" onclick="closeCategoryModal()">&times;</span>
                </div>
                <ul id="modalCategoryList" class="modal-list">
                    <!-- Εδώ θα μπαίνουν δυναμικά οι κατηγορίες με τους κάδους τους -->
                </ul>
            </div>
        </div>

    </div>
    
    <script src="js/app.js"></script>
</body>
</html>
