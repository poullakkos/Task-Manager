<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager - Εγγραφή</title>
    <link rel="stylesheet" href="css/register.css">
</head>
<body>

    <div class="content-box">
        <h1 class="title">Νέος Λογαριασμός</h1>
        <p class="subtitle">Δημιούργησε τον λογαριασμό σου για να ξεκινήσεις.</p>
        
        <form id="registerForm">
            
            <div class="form-group">
                <label for="username">Όνομα Χρήστη</label>
                <input type="text" id="username" class="form-control" placeholder="π.χ. kostas" required>
            </div>

            <div class="form-group">
                <label for="password">Κωδικός Πρόσβασης</label>
                <input type="password" id="password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-primary">Εγγραφή</button>
            
        </form>

        <div class="auth-links">
            Έχεις ήδη λογαριασμό; <a href="/login.html">Συνδέσου εδώ</a>
        </div>
    </div>
    <script src="js/register.js"></script>
</body>
</html>
