<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager - Σύνδεση</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <div class="content-box">
        <h1 class="title">Καλώς Ήρθες!</h1>
        <p class="subtitle">Συνδέσου για να δεις τα tasks σου.</p>
        
        <form id="loginForm">
            
            <div class="form-group">
                <label for="username">Όνομα Χρήστη</label>
                <input type="text" id="username" class="form-control" placeholder="π.χ. kostas" required>
            </div>

            <div class="form-group">
                <label for="password">Κωδικός Πρόσβασης</label>
                <input type="password" id="password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-primary">Είσοδος</button>
            
        </form>

        <div class="auth-links">
            Δεν έχεις λογαριασμό; <a href="/register.html">Κάνε εγγραφή εδώ</a>
        </div>
    </div>
    <script src="js/login.js"></script>
</body>
</html>
